<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <meta name="description" content="离线数据结构期末复习：章节知识、算法步骤、题型训练和模拟卷。">
  <title>数据结构 · 期末复习</title>
  <script>
    (() => {
      const key = 'ds-final-review-theme-v1';
      let saved = null;
      try { saved = localStorage.getItem(key); } catch {}
      const theme = saved === 'light' || saved === 'dark'
        ? saved
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <a href="#overview" class="brand" data-view="overview" aria-label="数据结构期末复习首页">
      <span class="brand-mark" aria-hidden="true">D<span>S</span></span>
      <span><b>数据结构</b><small>FINAL REVIEW · 离线复习站</small></span>
    </a>
    <div class="topbar-tools">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="暗色主题" aria-pressed="false" title="切换为暗色主题"><span aria-hidden="true">☾</span></button>
      <div class="topbar-note"><span class="status-dot"></span> 本地运行 · 学习记录仅存于此浏览器</div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-label">复习工作台</div>
      <nav class="primary-nav" aria-label="主要导航">
        <button class="nav-item is-active" data-view="overview"><span class="nav-icon">◫</span>复习总览</button>
        <button class="nav-item" data-view="chapters"><span class="nav-icon">▤</span>章节知识</button>
        <button class="nav-item" data-view="practice"><span class="nav-icon">✳</span>题型练习</button>
        <button class="nav-item" data-view="mock"><span class="nav-icon">▦</span>100分模拟卷</button>
        <button class="nav-item" data-view="lab"><span class="nav-icon">⌘</span>算法演练</button>
        <button class="nav-item" data-view="wrong"><span class="nav-icon">↺</span>错题与记录 <span id="wrong-count" class="nav-count">0</span></button>
        <button class="nav-item" data-view="scope"><span class="nav-icon">ⓘ</span>范围与口径</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-label">资料范围</div>
        <p>严蔚敏等《数据结构（C语言版）第3版》章节知识。考纲材料的不确定处均保留说明。</p>
      </div>
    </aside>
    <main id="main" class="main-content" tabindex="-1">
      <div id="app" aria-live="polite" aria-busy="true"><div class="loading-card">正在载入本地复习内容…</div></div>
    </main>
  </div>
  <footer class="site-footer"><span>DATA STRUCTURES · STUDY LOCALLY</span><span>题目为自编训练，不代表原题或押题</span></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
